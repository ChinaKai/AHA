[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aha-cli"
version = "0.1.0"
description = "Agent-help-agent orchestration CLI prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AHA contributors" }
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
hardware = ["pyserial>=3.5"]
feishu = ["lark-channel-sdk>=1.2,<2"]

[project.scripts]
aha = "aha_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aha_cli" = ["assets/*.ico", "assets/*.ps1"]
"aha_cli.web" = ["static/*"]
"aha_cli.prompts" = ["*.md"]
